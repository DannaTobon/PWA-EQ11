# Workflow académico de Semana 09. Es retroalimentación formativa; la
# calificación final usa el commit fijado y los checks privados del docente.
name: Academic Evaluation — Week 09
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academic-evaluation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Misma versión que .nvmrc: el proyecto fija Node 20.19.6.
          node-version: "20.19.6"
          cache: npm
      - name: Install dependencies (instalación limpia)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Security tests
        run: npx vitest run tests/security.spec.ts
      - name: Credential scan
        run: npm run scan:secrets
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full verification (lint, typecheck, tests, coverage, build, secrets, E2E)
        run: npm run verify:full
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-w09-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            coverage/
            vitest-report.json
            test-results/
            playwright-report/
            reports/verification.json
