# Generated by engineering-professor. This workflow is formative feedback.
# Do not use a student-editable workflow as the sole final grading authority.
name: Academic Evaluation Feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup 1
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
      - name: AC-02 - Los artefactos declarados para la actividad existen.
        shell: bash
        run: |
          set -euo pipefail
          test -e 'src/lib/sync/queue.ts' && test -e 'src/lib/storage/schema.ts' && test -e 'src/lib/sync/conflict-policy.ts' && test -e 'docs/sync-policy.md' && test -e 'tests/sync.spec.ts'
      - name: AC-01 y AC-03 - Verificación técnica completa
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-w05-sync-data
          if-no-files-found: error
          path: |
            reports/verification.json
            vitest-report.json
